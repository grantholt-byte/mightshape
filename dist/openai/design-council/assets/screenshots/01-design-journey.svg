  <text x="94" y="250" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#6457FF">JOURNEY</text>
  <text x="94" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="650" fill="#29262E">INTAKE ✓  ━  EMPATHIZE PLAN ✓  ━  DEFINE PROVISIONAL ✓  ━  IDEATE ✓  ━  PROTOTYPE ✓  ━  TEST ○</text>
  <rect x="94" y="352" width="1414" height="116" rx="18" fill="#EEECFF"/>
