  <text x="1032" y="606" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#4E4A52">? UNKNOWN</text>
  <text x="1032" y="646" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#35313A">Who coordinates?</text><text x="1032" y="678" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#35313A">Who approves changes?</text><text x="1032" y="710" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#35313A">Who repairs mistakes?</text>
  <text x="1032" y="760" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#736D77">HUMAN EVIDENCE: NONE</text>
