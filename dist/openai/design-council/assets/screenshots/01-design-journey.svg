  <rect x="94" y="564" width="438" height="244" rx="18" fill="#F8F7F3" stroke="#DEDAD2"/>
  <text x="124" y="606" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#312E36">USER_PROVIDED</text>
  <text x="124" y="646" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#35313A">A proposed AI family</text><text x="124" y="678" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#35313A">scheduler exists.</text>
  <text x="124" y="732" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#736D77">This establishes intent—</text><text x="124" y="760" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#736D77">not demand or fit.</text>
  <rect x="548" y="564" width="438" height="244" rx="18" fill="#FFF8E9" stroke="#EAD8AC"/>
  <text x="578" y="606" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#8C6110">△ ASSUMPTION</text>
  <text x="578" y="646" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#35313A">Automatic planning is</text><text x="578" y="678" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#35313A">better than visibility</text><text x="578" y="710" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#35313A">or negotiation.</text>
  <text x="578" y="760" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#736D77">OPEN / HIGH RISK</text>
