  <text x="248" y="150" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#655F6C">Think wider. Frame better. Build what matters.</text>
  <text x="1350" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" text-anchor="end" fill="#7A7480">LIVE ACCEPTANCE OUTPUT · 2026-08-12</text>
