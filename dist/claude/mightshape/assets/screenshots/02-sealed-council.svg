  <text x="94" y="118" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">◇ COUNCIL / SEALED ROUND</text>
  <text x="94" y="156" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#AAA3B2">Family scheduling · PANEL · DESIGN_COUNCIL · evidence strength 0</text>
  <text x="1506" y="124" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#8E8797">LIVE ACCEPTANCE OUTPUT · 2026-08-12</text>
  <rect x="94" y="204" width="452" height="238" rx="18" fill="#2B2732" stroke="#484151"/>
  <circle cx="132" cy="246" r="10" fill="#F17E7E"/><text x="156" y="254" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">MAYA · HUMAN REALITY</text>
  <text x="126" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#E4DFE8">Test whether this reduces</text><text x="126" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#E4DFE8">hidden vigilance—or simply</text><text x="126" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#E4DFE8">relocates repair work.</text>
  <text x="126" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#8F8799">ATTENTION: burden · recovery · agency</text>
  <rect x="574" y="204" width="452" height="238" rx="18" fill="#2B2732" stroke="#484151"/>
  <circle cx="612" cy="246" r="10" fill="#6CCBD1"/><text x="636" y="254" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">MEI · SYSTEMS ENGINEER</text>
  <text x="606" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#E4DFE8">Separate detecting a conflict,</text><text x="606" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#E4DFE8">deciding what should happen,</text><text x="606" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#E4DFE8">and committing the change.</text>
  <text x="606" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#8F8799">ATTENTION: state · authority · reliability</text>
  <rect x="1054" y="204" width="452" height="238" rx="18" fill="#2B2732" stroke="#484151"/>
  <circle cx="1092" cy="246" r="10" fill="#F0B65C"/><text x="1116" y="254" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">MARCUS · OPERATOR</text>
  <text x="1086" y="306" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#E4DFE8">Start with one recurring</text><text x="1086" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#E4DFE8">pinch point. Identify who</text><text x="1086" y="374" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#E4DFE8">owns every exception.</text>
  <text x="1086" y="412" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#8F8799">ATTENTION: labor · exceptions · adoption</text>
  <rect x="94" y="480" width="1412" height="106" rx="17" fill="#312B51" stroke="#6457FF" stroke-width="2"/>
  <text x="126" y="522" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="#BFB9FF">SEALED RECEIPT</text>
  <text x="126" y="559" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#FFFFFF">CP-FAMILY-001 · 3/3 Round A responses completed before sharing · frozen set FS-CR-001-3</text>
  <rect x="94" y="626" width="1412" height="208" rx="18" fill="#F4F0FF"/>
  <text x="126" y="674" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="1.6" fill="#5749D8">◇ MINORITY REPORT</text>
  <text x="126" y="724" font-family="Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#2B2634">Even a well-designed assistant may formalize unequal household authority.</text>
  <text x="126" y="764" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#50495A">An approval mechanism could make the most burdened person the permanent bottleneck.</text>
  <text x="126" y="801" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#746C7D">Preserve this objection until observation reveals who supplies information, approves changes, and performs recovery.</text>
  <text x="94" y="892" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#8E8797">Independent first. Social influence only after freeze. Dissent preserved before synthesis.</text>
</svg>
